<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}School Management System{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a> | 
        <a href="{% url 'student_list' %}">Students</a> | 
        <a href="{% url 'about' %}">About</a> | 
        <a href="{% url 'contact' %}">Contact</a>
    </nav>
    <hr>

    <!-- Display Django Messages -->
    {% if messages %}
        <ul style="color: green; font-weight: bold;">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <hr>
    <footer>
        <p>&copy; 2026 School Management System</p>
    </footer>
</body>
</html>
