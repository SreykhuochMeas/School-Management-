<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Course</title>
</head>
<body>
    <h1>Confirm Delete</h1>
    <p>Are you sure you want to delete the course: <strong>{{ course.name }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>
    <br>
    <a href="{% url 'course_list' %}">Cancel</a>
</body>
</html>
