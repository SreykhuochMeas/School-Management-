{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ action }} Student</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f4f6f8;
            color: #333;
            line-height: 1.6;
        }

        /* Navigation Menu styling */
        nav {
            background-color: #007bff;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 25px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Container Card */
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: 1.8em;
            text-align: center;
        }

        /* Form Controls Styling */
        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
            background-color: #fff9f5; /* ពណ៌ background ស្រាលដូចក្នុងរូប */
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: #007bff;
            outline: none;
            background-color: #ffffff;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background-color: #212529;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #343a40;
        }

        /* Back Link */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        hr {
            border: none;
            border-top: 1px solid #eaeaea;
            margin: 25px 0 15px 0;
        }

        footer {
            text-align: center;
            font-size: 0.88em;
            color: #777;
        }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'student_list' %}">Students</a>
        <a href="{% url 'course_list' %}">Courses</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>
    </nav>

    <div class="container">
        <h1>{{ action }} Student</h1>

        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit" class="btn-submit">Save</button>
        </form>

        <a href="{% url 'student_list' %}" class="back-link">Back to Student List</a>

        <hr>
        <footer>
            &copy; {{ today.year }} School Management System
        </footer>
    </div>

</body>
</html>
