<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #333;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #0066cc;
        }
        button {
            padding: 8px 16px;
            background-color: #d9534f;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #c9302c;
        }
        .cancel-link {
            margin-left: 10px;
            text-decoration: none;
            color: #0066cc;
        }
        hr {
            margin: 30px 0 15px 0;
            border: 0;
            border-top: 1px solid #ccc;
        }
        footer {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <nav>
        <a href="{% url 'home' %}">Home</a> | 
        <a href="{% url 'student_list' %}">Students</a> | 
        <a href="{% url 'about' %}">About</a> | 
        <a href="{% url 'contact' %}">Contact</a>
    </nav>

    <h1>Delete Student</h1>

    <p>Are you sure you want to delete <strong>{{ student.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
        <a class="cancel-link" href="{% url 'student_list' %}">Cancel</a>
    </form>

    <hr>
    
    <footer>
        <p>&copy; {{ today.year|default:"2026" }} School Management System</p>
    </footer>

</body>
</html>
